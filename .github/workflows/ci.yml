name: ci

on:
  # PR checks cover feature branches. Push runs only after a merge to main,
  # so the same commit is not tested twice.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Vulnerability scan
        # Pinned version, not @latest, so the gate is reproducible.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: go build ./cmd/domaincraft

      - name: Build WASM validator (js/wasm smoke)
        # The validator entry point is build-tagged js&&wasm, so the native
        # build above cannot see parser/validator/lexer/specmeta breakage.
        # Cross-compile to a temp path: no .wasm artifact is committed here.
        # The committed GUI binary is refreshed by hand with make build-wasm-gui.
        shell: bash
        run: GOOS=js GOARCH=wasm go build -o "$RUNNER_TEMP/validate.wasm" ./cmd/wasm-validator

      - name: Test
        # Shuffles order because suites mutate package-global seams.
        # CI must never skip the bundled-bridge contract gate via local opt-out.
        run: |
          unset DOMAINCRAFT_LOCAL_DEV
          go test -race -count=1 -shuffle=on ./...

      - name: Integration tests
        run: go test -tags=integration ./internal/bridge

  schema-check:
    name: Verify generated schema is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate schema to temp file
        run: go run ./cmd/schema-gen -o "$RUNNER_TEMP/domain.schema.json"

      - name: Compare schema with repo copy
        run: diff -u spec/domain.schema.json "$RUNNER_TEMP/domain.schema.json"
