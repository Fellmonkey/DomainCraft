name: ci

on:
  # PR checks cover feature branches. Push runs only after a merge to main,
  # so the same commit is not tested twice.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Build
        run: go build ./cmd/domaincraft

      - name: Test
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./internal/bridge

  schema-check:
    name: Verify generated schema is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate schema to temp file
        run: go run ./cmd/schema-gen -o "$RUNNER_TEMP/domain.schema.json"

      - name: Compare schema with repo copy
        run: diff -u spec/domain.schema.json "$RUNNER_TEMP/domain.schema.json"
