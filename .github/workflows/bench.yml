name: bench

# Timing benchmarks are reported, not gated: a CI runner is too noisy for a
# fixed time budget. Both sides run on the SAME runner, so benchstat can tell
# whether a change is real without a committed baseline from someone's laptop.
# Behavior is gated separately by the golden tests inside `go test ./...`.
on:
  pull_request:
    paths:
      - 'internal/**/*.go'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve base commit
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/base.sha"
          else
            git rev-parse HEAD~1 > "$RUNNER_TEMP/base.sha"
          fi
          cat "$RUNNER_TEMP/base.sha"

      - name: Benchmark base
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/base" "$(cat "$RUNNER_TEMP/base.sha")"
          # The base commit predates the bench target in some PRs. Use the PR's
          # Makefile so both sides run the exact same benchmark command.
          cp "$GITHUB_WORKSPACE/Makefile" "$RUNNER_TEMP/base/Makefile"
          cd "$RUNNER_TEMP/base"
          make bench BENCH_COUNT=5 > "$RUNNER_TEMP/base.txt"

      - name: Benchmark PR
        shell: bash
        run: |
          make bench BENCH_COUNT=5 > "$RUNNER_TEMP/pr.txt"

      - name: Compare with benchstat
        shell: bash
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c \
            "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/pr.txt" | tee "$RUNNER_TEMP/benchstat.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchstat
          path: ${{ runner.temp }}/benchstat.txt
          if-no-files-found: warn
