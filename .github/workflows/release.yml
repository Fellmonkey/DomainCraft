name: Release Build

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: build and test the current ref without publishing.
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.27.4'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged commit
    # A tag can be pushed without a preceding green main CI run. Run the same
    # gates as ci.yml before allowing a release to be published.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Check go.mod/go.sum are tidy
        run: make check-tidy

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vulncheck

      - name: Verify generated schema is up to date
        run: |
          go run ./cmd/schema-gen -o "$RUNNER_TEMP/domain.schema.json"
          diff -u spec/domain.schema.json "$RUNNER_TEMP/domain.schema.json"

      - name: Build WASM validator (js/wasm smoke)
        run: GOOS=js GOARCH=wasm go build -o "$RUNNER_TEMP/validate.wasm" ./cmd/wasm-validator

      - name: Test
        env:
          DOMAINCRAFT_LOCAL_DEV: ""
        run: go test -race -count=1 -shuffle=on ./...

  build-and-release:
    name: Build binaries and publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build all platforms
        run: |
          mkdir -p release
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          go build -ldflags="$LDFLAGS" -o release/domaincraft-linux-amd64 ./cmd/domaincraft
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o release/domaincraft-linux-arm64 ./cmd/domaincraft
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o release/domaincraft-darwin-amd64 ./cmd/domaincraft
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o release/domaincraft-darwin-arm64 ./cmd/domaincraft
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o release/domaincraft-windows-amd64.exe ./cmd/domaincraft

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/domaincraft-linux-amd64
            release/domaincraft-linux-arm64
            release/domaincraft-darwin-amd64
            release/domaincraft-darwin-arm64
            release/domaincraft-windows-amd64.exe
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
