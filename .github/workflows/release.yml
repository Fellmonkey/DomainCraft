name: Release Build

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: build and test the current ref without publishing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build binaries and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify the tagged commit passes tests
        # A tag can be pushed without a preceding green main CI run.
        run: go test ./...

      - name: Build all platforms
        run: |
          mkdir -p release
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          go build -ldflags="$LDFLAGS" -o release/domaincraft-linux-amd64 ./cmd/domaincraft
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o release/domaincraft-linux-arm64 ./cmd/domaincraft
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o release/domaincraft-darwin-amd64 ./cmd/domaincraft
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o release/domaincraft-darwin-arm64 ./cmd/domaincraft
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o release/domaincraft-windows-amd64.exe ./cmd/domaincraft

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/domaincraft-linux-amd64
            release/domaincraft-linux-arm64
            release/domaincraft-darwin-amd64
            release/domaincraft-darwin-arm64
            release/domaincraft-windows-amd64.exe
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
