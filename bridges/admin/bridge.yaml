name: admin-alpine
contract_version: 2
description: Admin panel with Alpine.js + 0build UIkit for DomainCraft
version: "1.1.0"
output_dir: admin
helpers: templates/helpers.html.tmpl

templates:
  - for: project
    source: templates/index.html.tmpl
    target: "admin/index.html"

  - for: entity
    source: templates/entity-list.html.tmpl
    target: "admin/{{ lower .Entity.NamePlural }}.html"

  - for: entity
    source: templates/entity-form.html.tmpl
    target: "admin/{{ lower .Entity.NamePlural }}-form.html"

  - for: project
    source: templates/login.html.tmpl
    target: "admin/login.html"
    when: hasAuth

  - for: project
    source: templates/register.html.tmpl
    target: "admin/register.html"
    when: hasAuth

  - for: project
    source: templates/docker-compose.override.yml.tmpl
    target: "docker-compose.override.yml"
