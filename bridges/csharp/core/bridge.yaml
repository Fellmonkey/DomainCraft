name: csharp-core
contract_version: 2
description: C# language core — enum wire values, entity types, query schema, permission matrix. Certified once per language.
version: "1.0.0"
layer: core
# C#-specific target framework. The core never bakes in a TFM: a bridge that
# resolves NuGet versions must declare the framework its templates generate.
target_framework: net10.0
helpers: templates/helpers.cs.tmpl
templates:
  - for: entity
    source: templates/entity.cs.tmpl
    target: "src/Domain/Entities/{{ .Entity.Name }}.g.cs"
  - for: project
    source: templates/enums.cs.tmpl
    target: "src/Domain/Shared/Enums.g.cs"
    when: hasEnums
  - for: project
    source: templates/PagedResult.cs.tmpl
    target: "src/Domain/Shared/PagedResult.g.cs"
  - for: project
    source: templates/query.cs.tmpl
    target: "src/Application/Query/Query.g.cs"
